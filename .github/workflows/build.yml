name: weirdos-esp32 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reine Logik ohne Hardware (Netzzonen-Planner/-Commit) wird auf dem Host gebaut
  # und getestet -- deshalb bleiben zone_planner.cpp/zone_commit.cpp ungegated.
  host-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zone planner + commit selftests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I. zone_planner.cpp tests/zone_planner_selftest.cpp -o zp_selftest && ./zp_selftest
          g++ -std=c++11 -Wall -Wextra -Werror -I. zone_commit.cpp  tests/zone_commit_selftest.cpp  -o zc_selftest && ./zc_selftest

  # Der Schnitt wird BEWIESEN: "full" muss dem bisherigen Build entsprechen,
  # "lean" (schwere Bausteine auf 0) muss linken -- faellt lean, ist ein Stub
  # unvollstaendig.
  arduino-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S3 full
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: ""
            optional: false
          - name: S3 lean (ohne VPN/Zonen/RTSP)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_WIREGUARD=0 -DWEIRDOS_FEATURE_IPSEC=0 -DWEIRDOS_FEATURE_ROUTER=0 -DWEIRDOS_FEATURE_RTSP=0"
            optional: false
          # Der reine Netzwerkadapter (VPN-Gateway/Tethering): KEIN Bildpfad im Image. Beweist den
          # CAMERA-Schnitt -- die esp32-camera-Komponente darf nicht mehr gelinkt werden.
          - name: S3 no-camera (Netzwerkadapter)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_CAMERA=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_RTSP=0"
            optional: false
          # P4-Pico: 16 MB Flash + PSRAM. Mit dem generischen esp32p4-Default (4 MB, 1,25-MB-App)
          # linkt der Vollausbau zwar, passt aber nicht in die App-Partition. Groesste
          # 16-MB-App-Partition des Cores: app3M_fat9M_16MB (3 MB App). Gemessen (Stand 85d7fc9):
          # Vollausbau MIT PSRAM (IPsec + Zonen an) 3 058 382 B = 97 % -- passt, aber ohne Luft;
          # jede neue Zeile im Vollausbau kippt diesen Job. Das ist gewollt: der P4-Vollausbau
          # ist die Obergrenze, die Profile sind der Normalfall. Beide Jobs sind blockierend.
          - name: P4 full (16 MB, PSRAM)
            fqbn: "esp32:esp32:esp32p4:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=enabled"
            flags: ""
            optional: false
          - name: P4 lean (ohne IPsec/Zonen)
            fqbn: "esp32:esp32:esp32p4:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=enabled"
            flags: "-DWEIRDOS_FEATURE_IPSEC=0 -DWEIRDOS_FEATURE_ROUTER=0"
            optional: false
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.11
      - name: Install ESP32 core 3.3.11
        run: |
          arduino-cli config init --overwrite --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Compile ${{ matrix.name }}
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings default \
            --build-property "compiler.c.extra_flags=${{ matrix.flags }}" \
            --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}" \
            .
