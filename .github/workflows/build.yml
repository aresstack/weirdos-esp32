name: weirdos-esp32 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reine Logik ohne Hardware (Netzzonen-Planner/-Commit) wird auf dem Host gebaut
  # und getestet -- deshalb bleiben zone_planner.cpp/zone_commit.cpp ungegated.
  host-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zone planner + commit selftests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I. zone_planner.cpp tests/zone_planner_selftest.cpp -o zp_selftest && ./zp_selftest
          g++ -std=c++11 -Wall -Wextra -Werror -I. zone_commit.cpp  tests/zone_commit_selftest.cpp  -o zc_selftest && ./zc_selftest
      # modules.json: jedes Profil gegen die harten Regeln (weirdos_module_rules.h) und unbekannte Schluessel
      - name: Profile in modules.json pruefen
        run: python3 ci/profile_flags.py --check

  # Der Schnitt wird BEWIESEN: "full" muss dem bisherigen Build entsprechen,
  # "lean" (schwere Bausteine auf 0) muss linken -- faellt lean, ist ein Stub
  # unvollstaendig.
  arduino-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S3 full
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: ""
            optional: false
          - name: S3 lean (ohne VPN/Zonen/RTSP)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_WIREGUARD=0 -DWEIRDOS_FEATURE_IPSEC=0 -DWEIRDOS_FEATURE_ROUTER=0 -DWEIRDOS_FEATURE_RTSP=0"
            optional: false
          # Der reine Netzwerkadapter (VPN-Gateway/Tethering): KEIN Bildpfad im Image. Beweist den
          # CAMERA-Schnitt -- die esp32-camera-Komponente darf nicht mehr gelinkt werden.
          - name: S3 no-camera (Netzwerkadapter)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_CAMERA=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_RTSP=0"
            optional: false
          # Kein WLAN (P4-Pfad auf dem S3): kein WiFi.h/ESPmDNS/SoftAP/Captive-Portal im Image, DynDNS ueber
          # Network.h. Beweist den WIFI-Schnitt (wifi_caps, ui_wlan, network_registry, .ino-WLAN-Regionen).
          - name: S3 no-wifi
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_WIFI=0"
            optional: false
          # Kein Mobilfunk (WLAN-Kamera, Repeater, Webcam): weder EC200A-Treiber noch USB-Host im Image.
          # Beweist die MODEM/USB_HOST-Stubs (ec200a_*.cpp, modem_*.cpp).
          - name: S3 no-modem
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0"
            optional: false
          # Verwaltung auf das Noetigste: kein HTTPS-Server (damit auch kein Let's Encrypt), keine Konsole,
          # keine Netzwerk-Diagnose, keine Sicherung. Beweist die Stubs der Bedien-/Verwaltungsbausteine
          # (cert_store/tls_selfsigned/weird_http_esp-HTTPS-Zweig, acme_client, serial_console, net_scan,
          # settings_backup) -- Weboberflaeche und OTA bleiben an.
          - name: S3 slim-control (ohne TLS/ACME/DynDNS/OTA/Konsole/Netscan/Backup/AES)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_TLS_SERVER=0 -DWEIRDOS_FEATURE_ACME=0 -DWEIRDOS_FEATURE_TLS_CLIENT=0 -DWEIRDOS_FEATURE_DYNDNS=0 -DWEIRDOS_FEATURE_OTA=0 -DWEIRDOS_FEATURE_CONSOLE=0 -DWEIRDOS_FEATURE_NETSCAN=0 -DWEIRDOS_FEATURE_BACKUP=0 -DWEIRDOS_FEATURE_CRYPTO_AES=0 -DWEIRDOS_FEATURE_IPSEC=0"
            optional: false
          # Headless (RTSP-Kamera nur mit Konsole): KEIN HTTP-Server -> keine Weboberflaeche, keine JSON-API,
          # kein OTA/HTTPS/ACME/MJPEG (Regeln). Beweist den HTTP-Schnitt: g_web, startWebServer() und damit
          # weird_http_esp/esp_http_server/weird_auth/alle Seiten verschwinden per gc-sections.
          - name: S3 headless (ohne HTTP)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_HTTP=0 -DWEIRDOS_FEATURE_WEBUI=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_OTA=0 -DWEIRDOS_FEATURE_TLS_SERVER=0 -DWEIRDOS_FEATURE_ACME=0"
            optional: false
          # API-only: HTTP-Server mit PIN-Gate und JSON-Routen, aber ohne Seiten/Assets (WEBUI=0).
          - name: S3 api-only (ohne WEBUI)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_WEBUI=0"
            optional: false
          # Die USB-Webcam: TinyUSB-Geraetestack (USBMode=default = USB-OTG statt HW-CDC) + UVC-Klasse.
          # Der Stack kostet ~48 KB statisches RAM -- deshalb ein eigener Baustein, nie Default.
          # Seit Lauf 14 gruen -> blockierend.
          - name: S3 webcam (USB-OTG + UVC)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0"
            optional: false
          # Das Profil "webcam" wortwoertlich: CAMERA + USB_DEVICE + UVC, sonst NICHTS -- kein IP-Stack, kein
          # Funk, kein Server, keine Konsole. Beweist den NET-Schnitt; die Groessenzeile ist die Untergrenze.
          # Webcam + USB-Mikrofon (UAC2, Baustein AUDIO): die Audio-Klasse der Core-Lib bleibt hier echt
          # (tinyusb_class_stubs.c stubbt audiod nur ohne AUDIO). S3 = I2S-PDM-Mikro des XIAO Sense.
          - name: S3 webcam+mic (UVC + UAC2)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1 -DWEIRDOS_FEATURE_AUDIO=1 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0"
            optional: false
          - name: S3 webcam-only (ohne NET)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_NET=0 -DWEIRDOS_FEATURE_WIFI=0 -DWEIRDOS_FEATURE_BLE=0 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0 -DWEIRDOS_FEATURE_HTTP=0 -DWEIRDOS_FEATURE_WEBUI=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_RTSP=0 -DWEIRDOS_FEATURE_ROUTER=0 -DWEIRDOS_FEATURE_WIREGUARD=0 -DWEIRDOS_FEATURE_IPSEC=0 -DWEIRDOS_FEATURE_CRYPTO_AES=0 -DWEIRDOS_FEATURE_DYNDNS=0 -DWEIRDOS_FEATURE_TLS_CLIENT=0 -DWEIRDOS_FEATURE_TLS_SERVER=0 -DWEIRDOS_FEATURE_ACME=0 -DWEIRDOS_FEATURE_OTA=0 -DWEIRDOS_FEATURE_NETSCAN=0 -DWEIRDOS_FEATURE_BACKUP=0 -DWEIRDOS_FEATURE_CONSOLE=0 -DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1"
            optional: false   # seit Lauf 18 gruen: 527 463 B Flash, 77 256 B statisch
          # Webcam + USB-Mikrofon (UAC2, AUDIO-Baustein). Sichert die Uebersetzung des
          # Audio-Pfads (mic_capture PDM + usb_device_service UAC2) -- die webcam-Jobs oben
          # bauen AUDIO=0 und pruefen ihn nie. S3 = PDM-Backend, P4 = ES8311-Backend.
          - name: S3 webcam + Audio (UAC2, PDM)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            flags: "-DWEIRDOS_FEATURE_NET=0 -DWEIRDOS_FEATURE_WIFI=0 -DWEIRDOS_FEATURE_BLE=0 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0 -DWEIRDOS_FEATURE_HTTP=0 -DWEIRDOS_FEATURE_WEBUI=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_RTSP=0 -DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1 -DWEIRDOS_FEATURE_AUDIO=1"
            optional: false
          - name: P4 webcam + Audio (UAC2, ES8311)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            flags: "-DWEIRDOS_FEATURE_NET=0 -DWEIRDOS_FEATURE_WIFI=0 -DWEIRDOS_FEATURE_BLE=0 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0 -DWEIRDOS_FEATURE_HTTP=0 -DWEIRDOS_FEATURE_WEBUI=0 -DWEIRDOS_FEATURE_VIDEO_HTTP=0 -DWEIRDOS_FEATURE_RTSP=0 -DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1 -DWEIRDOS_FEATURE_AUDIO=1"
            optional: false
          # Waveshare ESP32-P4-Pico: 32 MB Flash + 32 MB PSRAM (BOARD_SETTINGS.md). Mit dem generischen
          # esp32p4-Default (4 MB, 1,25-MB-App) passt kein WeirdOS-Build. default_32MB = zwei 12,5-MB-
          # App-Slots (OTA) + Datenpartition "spiffs" (die LittleFS der Firmware erwartet -- das 16-MB-
          # Schema hat nur "ffat"). Dieselbe FQBN setzt das Cam-Tool (weirdos_board_defaults). Bis Lauf 18
          # wurde gegen app3M_fat9M_16MB (3 MB App) gemessen; der Vollausbau fuellte die zu 83 %.
          - name: P4 full (32 MB, PSRAM)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            flags: ""
            optional: false
          - name: P4 lean (ohne IPsec/Zonen)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            flags: "-DWEIRDOS_FEATURE_IPSEC=0 -DWEIRDOS_FEATURE_ROUTER=0"
            optional: false
          # P4 = ES8311-Codec ueber I2S-Std + I2C (mic_capture.cpp waehlt das Backend per Target).
          - name: P4 webcam+mic (UVC + UAC2, FS-Port)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            flags: "-DWEIRDOS_FEATURE_USB_DEVICE=1 -DWEIRDOS_FEATURE_UVC=1 -DWEIRDOS_FEATURE_AUDIO=1 -DWEIRDOS_FEATURE_MODEM=0 -DWEIRDOS_FEATURE_USB_HOST=0"
            optional: false
          # Profile WORTWOERTLICH aus modules.json (ci/profile_flags.py): dieselben Flags, die das
          # Cam-Tool erzeugt. Die Standardrolle: RTSP ueber LTE im IPsec-Tunnel, mit Weboberflaeche --
          # und ihr Rueckfall ohne Weboberflaeche (Einrichtung ueber die serielle Konsole).
          - name: S3 Profil surveillance-lte-ipsec (Standardrolle)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            profile: surveillance-lte-ipsec
            optional: false
          - name: P4 Profil surveillance-lte-ipsec (Standardrolle)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            profile: surveillance-lte-ipsec
            optional: false
          - name: S3 Profil surveillance-lte-ipsec-headless (nur Konsole)
            fqbn: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB"
            profile: surveillance-lte-ipsec-headless
            optional: false
          - name: P4 Profil surveillance-lte-ipsec-headless (nur Konsole)
            fqbn: "esp32:esp32:esp32p4:FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=enabled"
            profile: surveillance-lte-ipsec-headless
            optional: false
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.11
      - name: Install ESP32 core 3.3.11
        run: |
          arduino-cli config init --overwrite --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      # Flags: entweder wortwoertlich aus der Matrix (Schnitt-Beweise) oder aus einem Profil der modules.json.
      - name: Compile-Flags bestimmen
        run: |
          if [ -n "${{ matrix.profile }}" ]; then FLAGS=$(python3 ci/profile_flags.py "${{ matrix.profile }}"); else FLAGS='${{ matrix.flags }}'; fi
          echo "FLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "$FLAGS"
      - name: Compile ${{ matrix.name }}
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings default \
            --build-property "compiler.c.extra_flags=$FLAGS" \
            --build-property "compiler.cpp.extra_flags=$FLAGS" \
            . 2>&1 | tee build.log
      # Groessen als Annotation am Check-Run: die stehen sonst nur im Log (Download nur mit Token),
      # als Annotation liest sie die oeffentliche API (GET .../check-runs/{job_id}/annotations) -> MODULES.md §8.
      - name: Groessen melden
        if: always()
        run: |
          grep -a "Sketch uses\|Global variables use" build.log | sed 's/\x1b\[[0-9;]*m//g' | \
            while IFS= read -r line; do echo "::notice title=${{ matrix.name }}::$line"; done
