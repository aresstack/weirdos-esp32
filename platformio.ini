; ============================================================================
; platformio.ini  --  Arduino 3.3.11 als ESP-IDF-5.5.5-Komponente
;
; Zweck: lwIP aus sdkconfig.defaults wirklich neu bauen, ohne den bestehenden
; Arduino-IDE-Sketch zu duplizieren oder manuell in C++ umzuschreiben.
; ============================================================================

[platformio]
src_dir = src

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
monitor_speed = 115200

; NetworkClientSecure (via WiFiClientSecure/DynDNS-HTTPS) wird sonst nur teilweise
; gebaut: NetworkClientSecure.cpp kompiliert, sein internes ssl_client.cpp aber
; nicht -> "undefined reference to start_ssl_client/stop_ssl_socket/...". Ein
; tieferer Library-Dependency-Scan zieht die kompletten Library-Quellen ein.
lib_ldf_mode = deep+

; Kopiere vor dem Build nur den Root-Sketch in src/. PlatformIOs eigener
; InoToCPPConverter erzeugt dort daraus die prototypisierte *.ino.cpp. Die
; ausgelagerten .cpp-Dateien bleiben im Root die einzige Quelle und werden vom
; src/CMakeLists.txt direkt referenziert.
extra_scripts =
    pre:scripts/prepare_idf_sources.py

; XIAO ESP32-S3 hat 8 MB Flash. default_8MB besitzt zwei OTA-App-Slots.
board_build.partitions = default_8MB.csv

; WICHTIG fuer den EC200A-USB-Host:
; ESP32-S3 USB-OTG und USB-Serial/JTAG teilen sich denselben internen PHY.
; Deshalb darf Arduino Serial beim Boot NICHT als HW-USB-CDC gestartet werden.
; Serial bleibt UART0; usb_host_install() kann den internen PHY exklusiv fuer
; den OTG-Host auf GPIO19/20 verwenden. USB_MODE=1 bleibt nur als Compile-Modus
; fuer den S3 gesetzt, aktiviert ohne CDC_ON_BOOT aber keinen Serial-USB-Stream.
; Das Board (XIAO S3) definiert ARDUINO_USB_CDC_ON_BOOT=1 selbst und haengt das
; -D NACH den build_flags an -> ein vorheriges -U half nicht. build_unflags
; entfernt die Board-Definition aus dem FINALEN Flag-Satz; danach ist unser
; -D...=0 das einzige -> keine Redefinition mehr unter -Werror.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

; Auch auf IDF-Seite keine USB-CDC-Konsole auf dem OTG-Controller aktivieren.
; Sonst wuerde dieselbe PHY-Ressource erneut mit dem EC200A-Host kollidieren.
